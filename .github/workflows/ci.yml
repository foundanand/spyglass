name: CI

# Runs on every push and pull request to master. With branch protection
# requiring PRs into master, wiring "collector" as a required status check
# means the air-gap guarantee (collector/airgap_test.go) is enforced before
# anything can merge — no accidental outbound call or CDN asset gets in.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  collector:
    name: collector (build + air-gap guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: collector/go.sum
      # The dashboard bundle (collector/dashboard/ui/dist) is a build artifact,
      # not committed, and is consumed by `//go:embed all:ui/dist`. It must exist
      # before any go command, or the embed fails to compile. Building it here
      # also lets TestNoExternalAssetsInDashboard run for real instead of skipping.
      - name: build embedded dashboard
        working-directory: collector/dashboard/ui
        run: npm install --no-audit --no-fund && npm run build
      # The dashboard's initial payload is budgeted so the replay engine cannot
      # creep back into it. rrweb is ~81KB gz and belongs in a lazy chunk; a
      # stray static import would quietly sextuple what every page load costs.
      - name: dashboard size budget
        working-directory: collector/dashboard/ui
        run: npm run size-check
      # A static guard for the accessibility defects this UI actually had:
      # icon-only buttons with no name, headers with no scope, uncaptioned
      # tables, a slider role without its value attributes. It does not replace
      # a browser audit — see the script's header for what it cannot see.
      - name: dashboard accessibility guard
        working-directory: collector/dashboard/ui
        run: npm run a11y-check
      - name: go vet
        working-directory: collector
        run: go vet ./...
      - name: go test (includes air-gap guard)
        working-directory: collector
        run: go test ./...
      - name: build static binary (CGO off, pure-Go SQLite)
        working-directory: collector
        run: CGO_ENABLED=0 go build -o /dev/null .

  sdk:
    name: sdk (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — pnpm/action-setup reads it from package.json's
      # `packageManager` field; specifying both errors with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm --filter @foundanand/spyglass-sdk typecheck
      - name: unit tests
        run: pnpm --filter @foundanand/spyglass-sdk test
      # The core has a 5KB gzipped budget, and its entry must import nothing
      # external — a linked SDK whose entry pulls in react loads a second copy
      # of it, and the resulting hook errors point nowhere near the cause.
      - name: sdk size budget and link safety
        run: pnpm --filter @foundanand/spyglass-sdk build && pnpm --filter @foundanand/spyglass-sdk size-check

  # Publish the SDK to npm when a merge lands on master and everything above is
  # green. `needs` is what enforces "passes everything" — this job cannot start
  # until both the collector job (including the air-gap guard) and the sdk job
  # have succeeded.
  publish:
    name: publish sdk to npm
    needs: [collector, sdk]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # write, because the last step pushes a release tag.
      contents: write
      # Lets npm attach a provenance attestation, so anyone installing the
      # package can verify which commit and workflow built it.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile

      # Two reasons to skip, neither of which is a failure:
      #
      #   1. The version is already on npm. A merge that does not bump the
      #      version is the normal case, and npm refuses to republish — without
      #      this, every collector-only merge would fail an otherwise green build.
      #   2. No NPM_TOKEN is configured. A fork, or this repo before the secret
      #      is added, should not have a red build over a release it was never
      #      going to make.
      - name: should we publish?
        id: check
        working-directory: sdk
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$HAS_TOKEN" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not configured — skipping publish of $NAME@$VERSION."
            exit 0
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already on npm — nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is new — publishing."
          fi

      - name: build
        if: steps.check.outputs.publish == 'true'
        run: pnpm --filter @foundanand/spyglass-sdk build

      # Re-checked here rather than trusting the sdk job: this is the artifact
      # that reaches consumers, and it is built again in this job.
      - name: size budget and link safety
        if: steps.check.outputs.publish == 'true'
        run: pnpm --filter @foundanand/spyglass-sdk size-check

      - name: publish
        if: steps.check.outputs.publish == 'true'
        working-directory: sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: tag the release
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "sdk-v${{ steps.check.outputs.version }}"
          git push origin "sdk-v${{ steps.check.outputs.version }}"
